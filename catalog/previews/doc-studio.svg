<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><filter id="shadow-1" width="894" height="1223" x="-50" y="-44" filterUnits="userSpaceOnUse"><feGaussianBlur in="SourceGraphic" stdDeviation="14"/></filter></defs><path fill-opacity=".28" d="M0 6h794v1123H0z" filter="url(#shadow-1)"/><path fill="#e9f3ed" d="M0 0h794v1123H0z"/><path fill="#047d53" d="M67 120.3h660v2H67z"/><text x="67" y="82" fill="#0c322c" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="27.3" font-weight="700" letter-spacing="-.27">Your document title</text><g fill="#0c322c" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="13"><text x="67" y="131.48" font-weight="400">Welcome to</text><text x="138.27" y="131.48" font-weight="700">Doc Studio</text><text x="205.84" y="131.48" font-weight="400">- a real word processor. Select and delete across anything, and insert tables, lists and images</text><text x="67" y="150.98" font-weight="400">inline.</text></g><path fill="#047d53" d="M67 217.75h660v2H67z"/><text x="67" y="188.53" fill="#0c322c" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="20.8" font-weight="700" letter-spacing="-.21">Write the way you think</text><text x="86.5" y="230.88" fill="#0c322c" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400">Paste rich text - bold, italics, lists and tables keep their shape</text><rect width="4.41" height="4.41" x="73.5" y="237.94" fill="#047d53" rx="2.2" ry="2.2"/><text x="86.5" y="252.97" fill="#0c322c" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400">Insert a Lolly render (a QR code, a chart, a map) inline</text><rect width="4.41" height="4.41" x="73.5" y="260.03" fill="#047d53" rx="2.2" ry="2.2"/><text x="86.5" y="275.06" fill="#0c322c" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400">Headings 1 to 4, SUSE or SUSE Mono, export to PDF</text><rect width="4.41" height="4.41" x="73.5" y="282.12" fill="#047d53" rx="2.2" ry="2.2"/><text x="67" y="1095.41" fill="#3a5852" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500">Untitled document</text><text x="706.06" y="1095.41" fill="#3a5852" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="400">1 / 1</text></svg>
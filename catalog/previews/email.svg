ize="31.05" font-weight="700">1.</text><text x="110.27" y="409.23" fill="#0c322c" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="31.05" font-weight="400">Which workloads would you move first?</text><text x="60" y="464.17" fill="#1d7251" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="31.05" font-weight="700">2.</text><text x="110.27" y="464.17" fill="#0c322c" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="31.05" font-weight="400">What does a renewal cost you if nothing changes?</text><text x="60" y="519.11" fill="#1d7251" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="31.05" font-weight="700">3.</text><text x="110.27" y="519.11" fill="#0c322c" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="31.05" font-weight="400">Who needs to see the plan before it goes ahead?</text><g fill="#0c322c" dominant-baseline="text-before-edge" font-family="SUSE, ui-sans-serif, system-ui, sans-serif" font-size="31.05" font-weight="400"><text x="60" y="586.47">Best,</text><text x="60" y="630.55">Alex</text></g></svg>